[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mesheval"
version = "0.1.0"
description = "Geometric-accuracy evaluation for reconstructed meshes"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["open3d>=0.17", "numpy"]

[project.scripts]
evaluate-meshes = "mesheval.cli:main"

[tool.setuptools]
packages = ["mesheval"]
